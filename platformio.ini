[platformio]
default_envs = heltec_rx01

[env:heltec_base]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_protocol = esptool
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:heltec_rx01]
extends = env:heltec_base
build_flags =
  ${env:heltec_base.build_flags}
  -D MINA_READER_NUMBER=1

[env:heltec_rx02]
extends = env:heltec_base
build_flags =
  ${env:heltec_base.build_flags}
  -D MINA_READER_NUMBER=2

[env:heltec_rx03]
extends = env:heltec_base
build_flags =
  ${env:heltec_base.build_flags}
  -D MINA_READER_NUMBER=3
